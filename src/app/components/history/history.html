<mat-toolbar color="primary">
  <button mat-icon-button routerLink="/dashboard">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>Conversion History</span>
</mat-toolbar>

<div class="history-container">
  <mat-card class="history-card">
    <mat-card-content>
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> No. </th>
          <td mat-cell *matCellDef="let element; let i = index"> {{ i + 1 }} </td>
        </ng-container>

        <ng-container matColumnDef="originalValue">
          <th mat-header-cell *matHeaderCellDef> From Value </th>
          <td mat-cell *matCellDef="let element"> {{ element.originalValue }} </td>
        </ng-container>

        <ng-container matColumnDef="originalUnit">
          <th mat-header-cell *matHeaderCellDef> From Unit </th>
          <td mat-cell *matCellDef="let element"> {{ element.originalUnit }} </td>
        </ng-container>

        <ng-container matColumnDef="convertedValue">
          <th mat-header-cell *matHeaderCellDef> To Value </th>
          <td mat-cell *matCellDef="let element"> {{ element.convertedValue }} </td>
        </ng-container>

        <ng-container matColumnDef="convertedUnit">
          <th mat-header-cell *matHeaderCellDef> To Unit </th>
          <td mat-cell *matCellDef="let element"> {{ element.convertedUnit }} </td>
        </ng-container>

        <ng-container matColumnDef="timestamp">
          <th mat-header-cell *matHeaderCellDef> Date </th>
          <td mat-cell *matCellDef="let element"> {{ element.timestamp | date:'medium' }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div *ngIf="dataSource.length === 0 && !errorMessage" class="no-data">
        No history available.
      </div>
    </mat-card-content>
  </mat-card>
</div>
