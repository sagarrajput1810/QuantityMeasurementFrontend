<div class="login-container">
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="theme-toggle-container">
    <button mat-icon-button (click)="themeService.toggleTheme()" class="glass-btn">
      <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </div>
  
  <mat-card class="login-card glass-card">
    <mat-card-header>
      <div class="brand-logo-container">
        <div class="logo-inner-glow">
          <mat-icon>straighten</mat-icon>
        </div>
      </div>
      <mat-card-title>Quantity Master</mat-card-title>
      <mat-card-subtitle>Sign in to your dashboard</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="premium-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email Address</mat-label>
          <input matInput formControlName="email" type="email" placeholder="name@example.com">
          <mat-icon matPrefix>alternate_email</mat-icon>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Invalid email format</mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Secure Password</mat-label>
          <input matInput formControlName="password" type="password">
          <mat-icon matPrefix>lock_open</mat-icon>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
        </mat-form-field>

        <div *ngIf="errorMessage" class="error-message attractive-error">
          <mat-icon>error_outline</mat-icon> {{ errorMessage }}
        </div>

        <button mat-raised-button class="btn-premium full-width login-btn-glow" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Authenticating...' : 'Access Dashboard' }}
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer class="premium-footer">
      <p>New to the system? <a routerLink="/signup">Create account</a></p>
    </mat-card-footer>
  </mat-card>
</div>
